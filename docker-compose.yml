version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: ph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: payload
    volumes:
      - pgdata_hardcase:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload"]
      interval: 5s
      timeout: 3s
      retries: 10
  server:
    image: node:20-alpine
    container_name: ph-server
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://payload:payload@db:5432/payload
      PAYLOAD_SECRET: dev-secret-change-in-production
      NODE_ENV: development
    volumes:
      - ./server:/app
      - ./src/collections:/app/src/collections
      - ./payload.config.ts:/app/payload.config.ts
    ports:
      - "3001:3001"
    command: sh -c "npm install express payload ts-node && npm run dev"

volumes:
  pgdata_hardcase:
